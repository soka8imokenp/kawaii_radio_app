name: Build & release APK

# Every push to main builds a signed APK and publishes it as the latest GitHub Release.
# The app checks /releases/latest on launch and offers the update in-app.
on:
  push:
    branches: [main]
    paths-ignore: ['cloud/**']   # cloud-only changes don't need a new APK
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble signed release APK
        working-directory: native
        run: chmod +x gradlew && ./gradlew :androidApp:assembleRelease --no-daemon

      - run: cp native/androidApp/build/outputs/apk/release/androidApp-release.apk kawaii-radio.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Kawaii Radio v1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message || 'Yaxshilanishlar va tuzatishlar' }}
          files: kawaii-radio.apk
          make_latest: true
